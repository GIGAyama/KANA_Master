# 品質ゲート。
#
# ⚠️ pull_request でも 走らせること。
#   push: branches: [main] だけだと、PR の 時点で 落ちていることに
#   気づけず、main に 入ってから はじめて 赤くなる。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # ⚠️ 検査を 1 つずつ 書き写さないこと。package.json の check を そのまま 呼ぶ。
      #    ここには もともと build-sw --check / tests / check-project の 3 つが
      #    書き写してあったが、check の 先頭にある 正本ゲート
      #    scripts/check-standard.mjs が 写し漏れていて、共通検査 38 件
      #    （CSP・localStorage の 接頭辞・100dvh・セーフエリア・タップ 44px・
      #    画像の 大きさ など）が 一度も 動いていなかった。
      #
      #    check = node scripts/check-standard.mjs
      #         && node tools/build-sw.mjs --check   … 版の自動生成が ずれていないか
      #         && node tools/check-project.mjs      … 生成物が 原本と そろっているか
      #         && node tools/check-study.js         … 学習ログ（study.v1）
      #         && node --test tests/*.test.mjs      … 受け渡し口
      - name: 品質ゲート（package.json の check をそのまま）
        run: npm run check

      - name: 検査そのものが 動いているかを たしかめる
        # 「0件でした」だけでは 検査が 何も 見ていない 場合と 区別が つかない。
        # わざと 壊した 入力を 与えて、ちゃんと 落ちることを 見る。
        run: node tools/check-project.mjs --self-test

  measure:
    # 実ブラウザでの 計測（コントラスト・タップ領域・Service Worker）。
    # 読むだけでは わからないので、実際に ひらいて 測る。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: ブラウザを 入れる
        run: npx playwright install --with-deps chromium

      - name: 手元のサーバーを 立てる
        run: |
          node tools/serve.mjs 8788 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8788/KANA_Master/ >/dev/null && break
            sleep 1
          done

      - name: 見え方を 測る（コントラスト・タップ44px・CSP・JSエラー）
        run: node tools/measure-display.mjs

      - name: PWA の ふるまいを 測る
        run: node tools/measure-pwa.mjs

  # 正本（GIGAyama.github.io/standards/）との一致。コピーだけ直すと他リポジトリに修正が届かないため。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
