<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- 拡大の禁止（user-scalable=no / maximum-scale=1.0）は書かない。
       誤ズームを防ぐ効果より、見えづらい子が 拡大できない害のほうが 大きい。
       誤ズームは CSS の touch-action（body: manipulation ／ 手書き面: none）で
       じゅうぶん おさえられる。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ===== Content-Security-Policy =====
       このページが 読みこんでよい相手を 明示して 縛る。
       ・script-src 'self' … スクリプトは 自分のフォルダの ファイルだけ。
         インラインの <script> と onclick= は 実行されなくなるので、
         このアプリは すべて 外部ファイル（js/…）に 切り出してある。
       ・style-src に 'unsafe-inline' が いるのは、React が style={{…}} で
         書く インラインスタイルを 使っているため。
       ・connect-src 'self' … かきじゅんデータを アプリの中に 持ったので、
         外へ 通信する 必要が まったく ない。

       ⚠️ frame-ancestors は ここには 書かない。
          <meta> 経由では **無視され**、読みこむたび コンソールに 警告が出るだけ。
          他サイトへの 埋めこみを 止めるには HTTP ヘッダーが 要るが、
          GitHub Pages では 足せない。独自ドメインや CDN を 挟むときに
          サーバー側で frame-ancestors 'none' を 設定すること。 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self';
    worker-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />

  <title>ひらがな・カタカナかきかたマスター</title>
  <meta name="description" content="小学1年生のための、ひらがな・カタカナの かきじゅん れんしゅう＆ことばあつめアプリ。書き順アニメ・なぞり書き・自動採点で、たのしく文字が身につきます。" />

  <!-- ===== インストールの合図を「いちばん先に」受けとる =====
       beforeinstallprompt は 条件がそろうと 読みこみ直後に 一度だけ 飛んでくる。
       ほかの読みこみより 後だと 合図を 取りこぼし、通信が遅い端末で
       「アプリにする」ボタンが 出なくなる。
       CSP に 'unsafe-inline' を 足さずに 済むよう、インラインではなく
       小さな外部ファイルにして 同期読みこみする。 -->
  <script src="./js/install-hook.js"></script>

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#b34328" />
  <meta name="color-scheme" content="light" />

  <link rel="icon" type="image/png" href="./favicon.png" />
  <!-- apple-touch-icon には 透明を ふくむ画像を 指さないこと。
       iOS は 透明部分を 黒で うめるため、ホーム画面で アイコンの 四隅だけが
       黒く 出る。この 180×180 は 下地を 端まで のばした 不透明の 専用画像。 -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="かきかたマスター" />

  <!-- ===== スタイル（生成物：tailwind.config.js ＋ src/extra.css） =====
       もとは cdn.tailwindcss.com を ブラウザに 読ませて、その場で CSS を
       つくらせていた。学校のネットワークが そこを ふさぐと 色も レイアウトも
       一切 当たらないため、ビルドで 先に つくる形に あらためた。
       直すのは tailwind.config.js と src/extra.css。`npm run build` で 生成。 -->
  <link rel="stylesheet" href="./css/app.css" />

  <!-- ===== 教科書体フォント =====
       表示する文字は「UD デジタル 教科書体」に統一する。
       このフォントは Windows 10 以降に標準搭載されている Morisawa 社の製品で、
       Web フォントとして配布することは許諾されていない。そのため
         1) 端末にインストールされていれば それを使う
         2) macOS の「游教科書体」
         3) どれも無ければ Google Fonts の Klee One（教科書体スタイルの楷書）
       の順にフォールバックする（src/extra.css の --kkm-font-kyokasho）。

       Google Fonts は「見た目だけ」の依存なので、学校で ふさがれても
       字の形が かわるだけで アプリは そのまま 動く。だから CDN のままでよい。
       （実行コード＝React などは ふさがれると 起動しないので 自己ホストした） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

  <!-- ===== 実行コード（すべて 自分のフォルダの中） =====
       defer なので 読みこみは 並行、実行は この順番。
         vendor/react.js       React 18 + ReactDOM 18（npm で版を固定して とりこみ）
         data/kanjivg-kana.js  かきじゅんデータ（KanjiVG・176文字）
         studyLog.js           全アプリ共通の 学習ログ（保存だけ・送信しない）
         studySession.js       このアプリ固有の 学習ログ組み立て
         js/app.js             App 本体（src/App.jsx をビルドしたもの）
         js/boot.js            Service Worker の登録と 更新のおしらせ
       どれも CDN を 使わないので、学校の フィルタリングで 止まることがない。 -->
  <script defer src="./vendor/react.js"></script>
  <script defer src="./data/kanjivg-kana.js"></script>
  <script defer src="./studyLog.js"></script>
  <script defer src="./studySession.js"></script>
  <script defer src="./js/app.js"></script>
  <script defer src="./js/boot.js"></script>
</head>
<body>
  <!-- ローディング表示（js/app.js を 読んでいる あいだ） -->
  <div id="root">
    <div class="kkm-loading">よみこみちゅう…</div>
  </div>
</body>
</html>
