<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#b34328" />
    <title>かきかたマスター | ページが みつかりません</title>
    <link rel="icon" type="image/png" href="/KANA_Master/favicon.png" />
    <!--
      GitHub Pages が「/KANA_Master/ の 下に 無い URL」を たたかれたときに
      かえす 画面。置かないと GitHub の 英語の 404（File not found）が出る。
      アドレスバーの ない ホーム画面アプリから ひらいた 子どもには、
      それは ただの まっ白な こわれた 画面にしか 見えない。

      ⚠️ リンクは かならず **絶対パス**（/KANA_Master/…）で 書くこと。
        この1枚は /KANA_Master/どこか/なにか のような、いろいろな 場所の
        代わりに 出される。相対パス（./）だと たたかれた URL が 基準に
        なるので、行き先が その都度 ずれる。

      配色・フォントの 考え方は offline.html と 同じ。この画面が 出るとき
      css/app.css も React も 読めているとは かぎらないので、1枚に 閉じる。
    -->
    <style>
      :root {
        --shu: #b34328;
        --paper: #faf7f0;
        --panel: #ffffff;
        --sumi: #2e2a25;
        --rule: #ded8cd;
      }
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100vh;   /* 古い端末むけのフォールバック */
        min-height: 100dvh;  /* 実際に使われる値 */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px))
                 calc(24px + env(safe-area-inset-right, 0px))
                 calc(24px + env(safe-area-inset-bottom, 0px))
                 calc(24px + env(safe-area-inset-left, 0px));
        background: var(--paper);
        color: var(--sumi);
        font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R',
                     'UDデジタル教科書体N-R', '游教科書体', 'YuKyokasho',
                     'Hiragino Mincho ProN', system-ui, serif;
        font-weight: 600;
        line-height: 1.8;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(46, 42, 37, 0.08);
        padding: 32px 24px;
        text-align: center;
      }
      .mark { font-size: clamp(48px, 14vw, 76px); line-height: 1; margin-bottom: 8px; }
      /* 日本語は語の途中で折り返すと読みにくい。区切りは <br> で明示し、それ以外では割らない。 */
      h1 { font-size: clamp(20px, 5vw, 26px); font-weight: 700; margin: 0 0 12px; word-break: keep-all; }
      p { font-size: clamp(15px, 3.6vw, 17px); margin: 0 0 22px; word-break: keep-all; }
      .btn {
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;      /* 児童の指でも押せる大きさ（Part I §2-4） */
        width: 100%;
        padding: 0 20px;
        font-size: clamp(16px, 4vw, 18px);
        font-weight: 700;
        font-family: inherit;
        /* #b34328 の上の白は 5.60:1。計算して確かめてある。 */
        color: #ffffff;
        background: var(--shu);
        border: none;
        border-radius: 14px;
        box-shadow: 0 4px 0 #93331e;
        cursor: pointer;
        touch-action: manipulation;
      }
      .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #93331e; }
      .btn:focus-visible { outline: 3px solid var(--sumi); outline-offset: 3px; }
      .hint {
        margin-top: 18px;
        margin-bottom: 0;
        font-size: clamp(13px, 3.2vw, 14px);
        /* 紙(#faf7f0)の上で 6.87:1。sumi-500 の #7a7267 は 4.43:1 で足りなかった。 */
        color: #5c554c;
      }
      .hint a { color: #8a3520; }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
      @media (forced-colors: active) {
        .btn { border: 2px solid ButtonText; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">🔎</div>
      <h1>この ページは<br />みつかりませんでした</h1>
      <p>
        したの ボタンを おすと、<br />
        かきかたマスターの さいしょに もどれます。
      </p>
      <!-- JavaScript にも 外部ファイルにも たよらない。ここが 出ている時点で
           なにかが 見つかっていないため。 -->
      <a class="btn" href="/KANA_Master/">かきかたマスターを ひらく</a>
      <p class="hint">
        おうちの方・先生へ：ホーム画面の アイコンから ひらいて この画面が
        出るときは、アプリの 保存先（URL）が 変わっています。アイコンを
        いちど 削除し、
        <a href="https://gigayama.github.io/KANA_Master/">https://gigayama.github.io/KANA_Master/</a>
        を ひらいて「アプリにする（ホーム画面に追加）」を し直してください。
      </p>
    </main>
  </body>
</html>
